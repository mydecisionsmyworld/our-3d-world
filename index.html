}

 chopJob=null;progress.style.display='none';
 if(addItem('wood',tree.wood)){
  removeTree(tree);saveFelledTrees();
  showToast('Tree chopped! +'+tree.wood+' wood');
 }else showToast('Inventory full: no wood collected.');
 nearby=null;updateNearby();renderInteraction();
}
const interact=document.getElementById('interaction'),iname=document.getElementById('interactionName'),
iinfo=document.getElementById('interactionInfo'),iactions=document.getElementById('interactionActions'),
toast=document.getElementById('toast');
let nearby=null;
function showToast(message){toast.textContent=message;toast.style.display='block';toast.dataset.until=String(performance.now()+2400);}
function renderInteraction(){
 if(!nearby||fly){interact.style.display='none';return;}
 const obj=resolveObject(nearby);
 if(!obj){interact.style.display='none';return;}
 interact.style.display='block';iname.textContent=obj.name;
 document.getElementById('chopProgress').style.display=chopJob?.id===obj.id?'block':'none';
 if(obj.id==='logstore')iinfo.textContent='Wood stored: '+slotCount(containerSlots.logs,'wood')+'/100 · tap Open inventory';
 else if(obj.id==='storage')iinfo.textContent='Chest: '+containerSlots.general.length+' slots · tap Open inventory';
 else if(obj.id.startsWith('tree-'))iinfo.textContent='Chop time: '+obj.duration.toFixed(1)+'s | Yield: '+obj.wood+' wood | '+(inventory[selectedSlot]?.id==='axe'?'Axe equipped':'Select an axe in hotbar')+(woodCapacity()<obj.wood?' | Inventory full':'');

 else if(obj.id==='fire')iinfo.textContent=world.fireLit?'Currently burning':'Currently unlit';
 else if(obj.id==='shower')iinfo.textContent=world.showerOn?'Water is running':'Water is turned off';
 else if(obj.id==='axe')iinfo.textContent='Reusable supply: the world axe never disappears';
 else if(obj.id.startsWith('seat')||obj.id.startsWith('bench'))iinfo.textContent=seatedAt===obj.id?'Currently sitting':'Sit here';
 else iinfo.textContent=world.tentSleeping?'Sleeping session active':'Sleeping area ready';
 iactions.replaceChildren();
 for(const action of availableActions(obj.id)){
   const b=document.createElement('button');b.type='button';b.textContent=action.label;b.disabled=!!action.disabled;
   b.addEventListener('click',()=>{const result=performAction(obj.id,action.id);if(!result.ok||action.id!=='chop'&&action.id!=='open')showToast(result.message);renderInteraction();});
   iactions.appendChild(b);
 }
}
function updateNearby(){
 if(chopJob){if(nearby!==chopJob.id){nearby=chopJob.id;renderInteraction();}return;}
 let best=null,bestDist=Infinity;
 if(!fly)for(const o of usable){
  if(seatedAt&&o.id!==seatedAt)continue;
  const d=distanceToObject(o,camera[0],camera[2]);
  if(d<=o.reach&&d<bestDist){bestDist=d;best=o.id;}
 }
 if(!fly&&!seatedAt)for(const tree of forestTrees){
  if(tree.chopped)continue;
  const distance=Math.max(0,Math.hypot(camera[0]-tree.x,camera[2]-tree.z)-tree.r);
  if(distance<1.7&&distance<bestDist){best=tree.id;bestDist=distance;}
 }
 if(nearby!==best){nearby=best;renderInteraction();}
}
let camera=[0,5,32],yaw=0,pitch=-.25,fly=false,axis=[0,0],drag=null,keys={},last=performance.now();
const pad=document.getElementById('pad'),knob=document.getElementById('knob');let padPointer=null;
function movePad(e){let r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.34,len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len;}axis=[dx/max,-dy/max];knob.style.transform='translate('+dx+'px,'+dy+'px)';}
pad.addEventListener('pointerdown',e=>{e.preventDefault();padPointer=e.pointerId;pad.setPointerCapture(e.pointerId);movePad(e);});pad.addEventListener('pointermove',e=>{if(e.pointerId===padPointer)movePad(e);});
function stopPad(e){if(e.pointerId===padPointer){padPointer=null;axis=[0,0];knob.style.transform='translate(0,0)';}}for(const ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,stopPad);
canvas.addEventListener('pointerdown',e=>{drag=[e.pointerId,e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag||drag[0]!==e.pointerId)return;yaw+=(e.clientX-drag[1])*.0055;pitch=Math.max(-1.15,Math.min(1.15,pitch-(e.clientY-drag[2])*.004));drag=[e.pointerId,e.clientX,e.clientY];});for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,()=>drag=null);
document.getElementById('fly').addEventListener('click',e=>{fly=!fly;e.currentTarget.textContent=fly?'✦ Walking mode':'✦ Fly mode';diag.textContent=fly?'FLY MODE: collisions disabled':'WALK MODE: collisions enabled';updateNearby();});document.getElementById('reset').addEventListener('click',()=>{camera=[0,5,32];yaw=0;pitch=-.25;updateNearby();});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow'))e.preventDefault();});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{axis=[0,0];keys={};knob.style.transform='translate(0,0)';});
status.style.display='none';diag.textContent='Ready: '+count+' vertices';
let frameNumber=0;function frame(t){try{let dt=Math.min(.05,(t-last)/1000);last=t;let forward=axis[1]+(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),right=axis[0]+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),m=Math.hypot(forward,right);if(m>1){forward/=m;right/=m;}let speed=(fly?18:6.5)*dt;const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*right)*speed,dz=(-Math.cos(yaw)*forward+Math.sin(yaw)*right)*speed;if(fly){if(storageOpen)closeStorage();if(chopJob){chopJob=null;document.getElementById('chopProgress').style.display='none';}seatedAt=null;camera[0]=Math.max(-93,Math.min(93,camera[0]+dx));camera[2]=Math.max(-93,Math.min(93,camera[2]+dz));camera[1]+=Math.sin(pitch)*forward*speed;camera[1]=Math.max(ground(camera[0],camera[2])+eyeHeight,camera[1]);}else {const steps=seatedAt||chopJob||storageOpen?0:Math.max(1,Math.ceil(Math.hypot(dx,dz)/.25));for(let i=0;i<steps;i++){const sx=dx/steps,sz=dz/steps;if(!blocked(camera[0]+sx,camera[2]))camera[0]+=sx;if(!blocked(camera[0],camera[2]+sz))camera[2]+=sz;}camera[1]+=(ground(camera[0],camera[2])+(seatedAt?1.02:eyeHeight)-camera[1])*.14;}
let w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,1.5),pw=Math.floor(w*dpr),ph=Math.floor(h*dpr);if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph;gl.viewport(0,0,pw,ph);}gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix4fv(projLoc,false,perspective(1.12,w/h,.1,300));gl.uniformMatrix4fv(viewLoc,false,view(camera,yaw,pitch));gl.drawArrays(gl.TRIANGLES,0,fireFlameStart);if(world.fireLit)gl.drawArrays(gl.TRIANGLES,fireFlameStart,fireFlameEnd-fireFlameStart);gl.drawArrays(gl.TRIANGLES,fireFlameEnd,showerWaterStart-fireFlameEnd);if(world.showerOn)gl.drawArrays(gl.TRIANGLES,showerWaterStart,showerWaterEnd-showerWaterStart);gl.drawArrays(gl.TRIANGLES,showerWaterEnd,count-showerWaterEnd);advanceChopping(t);if(++frameNumber%12===1)updateNearby();if(toast.style.display==='block'&&performance.now()>Number(toast.dataset.until))toast.style.display='none';if(frameNumber%60===1){let err=gl.getError();diag.textContent='v1.2 | '+(fly?'FLY (no collision)':'WALK (solid)')+' | Objects '+obstacles.length+' | Hits '+collisionHits+' | GL '+err;}requestAnimationFrame(frame);}catch(e){diag.textContent='RENDER ERROR: '+e.message;diag.style.background='#992323';console.error(e);}}
requestAnimationFrame(frame);
})();
</script></body></html>
