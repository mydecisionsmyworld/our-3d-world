<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#91b8cc">
<title>Our 3D World | The Valley</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9abccc;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;text-shadow:0 2px 6px #123b37;pointer-events:none}h1{font-size:18px;letter-spacing:.13em;margin:0}#hud p{font-size:12px;margin:5px 0}
#guide{position:absolute;top:max(21px,env(safe-area-inset-top));right:16px;font-size:11px;text-shadow:0 1px 5px #123;pointer-events:none;text-align:right}
#pad{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:22px;width:132px;height:132px;border:2px solid #ffffff8a;border-radius:50%;background:#19483b91;touch-action:none;user-select:none;display:grid;place-items:center}
#knob{width:50px;height:50px;border-radius:50%;background:#dbf3dddc;border:2px solid #fff;box-shadow:0 3px 14px #0003;pointer-events:none}
#buttons{position:absolute;bottom:max(33px,env(safe-area-inset-bottom));right:18px;display:flex;flex-direction:column;gap:10px}button{background:#244f48c9;border:1px solid #ffffff99;border-radius:13px;padding:13px 16px;color:white;font:600 13px system-ui;touch-action:manipulation}button:active{background:#538f79}
#status{position:absolute;inset:0;background:linear-gradient(#94c4d9,#b5d4a3);display:grid;place-items:center;text-align:center;padding:20px;color:#164336;font-size:16px;font-weight:700}
#reticle{position:absolute;top:50%;left:50%;height:4px;width:4px;background:#fffc;border-radius:50%;pointer-events:none}
@media(max-width:370px){#guide{display:none}#pad{width:112px;height:112px}#knob{width:42px;height:42px}}
</style></head>
<body>
<canvas id="world" aria-label="3D landscape"></canvas>
<div id="hud"><h1>WOODLAND CAMP <small style="font-size:10px">v0.5</small></h1><p>A home in the forest</p></div>
<div id="guide">Drag to look around<br>Move with the joystick</div><div id="reticle"></div>
<div id="pad" aria-label="Movement joystick"><div id="knob"></div></div>
<div id="buttons"><button id="fly">✦ Fly mode</button><button id="reset">↺ Reset view</button></div>
<div id="status">Growing the woodland...</div><div id="diag" style="position:absolute;top:76px;left:16px;border-radius:8px;background:#123a37c9;color:#fff;font:11px monospace;padding:7px;pointer-events:none">Starting renderer...</div>
<script>
(function(){
'use strict';
const diag=document.getElementById('diag');window.addEventListener('error',e=>{diag.textContent='ERROR: '+e.message;diag.style.background='#992323';});const canvas=document.getElementById('world'),status=document.getElementById('status'),gl=canvas.getContext('webgl',{alpha:false,antialias:true,powerPreference:'default'});
if(!gl){status.textContent='WebGL is unavailable. Try Chrome or Safari.';return;}
const vert='attribute vec3 p,c,n;uniform mat4 proj,view;varying vec3 color;varying float fog;void main(){vec4 q=view*vec4(p,1.);gl_Position=proj*q;float light=.68+.32*max(dot(normalize(n),normalize(vec3(.4,.9,.5))),0.);color=c*light;fog=clamp((-q.z-35.)/165.,0.,.87);}';
const frag='precision mediump float;varying vec3 color;varying float fog;void main(){gl_FragColor=vec4(mix(color,vec3(.69,.81,.87),fog),1.);}';
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
let prog;try{prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vert));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));}catch(e){status.textContent='Graphics failed: '+e.message;return;}gl.useProgram(prog);
let positions=[],colors=[],normals=[];
const obstacles=[],playerRadius=.58;
function solidBox(x,z,w,d){obstacles.push({kind:'box',x,z,w:w/2,d:d/2});}
function solidTrunk(x,z,r){obstacles.push({kind:'trunk',x,z,r});}
function blocked(x,z){
  if(x < -93||x > 93||z < -93||z > 93)return true;
  for(const o of obstacles){
    if(o.kind==='box'){
      const cx=Math.max(o.x-o.w,Math.min(x,o.x+o.w)),cz=Math.max(o.z-o.d,Math.min(z,o.z+o.d));
      if((x-cx)*(x-cx)+(z-cz)*(z-cz)<playerRadius*playerRadius)return true;
    }else{
      const dx=x-o.x,dz=z-o.z,r=o.r+playerRadius;
      if(dx*dx+dz*dz<r*r)return true;
    }
  }
  return false;
}
function tri(a,b,c,color){const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]],n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...n)||1;for(const q of [a,b,c]){positions.push(...q);colors.push(...color);normals.push(n[0]/len,n[1]/len,n[2]/len);}}
function quad(a,b,c,d,k){tri(a,b,c,k);tri(a,c,d,k);}
function rnd(n){let a=Math.sin(n*127.1+78.2)*43758.5453;return a-Math.floor(a);}
function ground(x,z){const d=Math.hypot(x,z),lake=Math.hypot(x+55,z+42);let raw=-.2+Math.sin(x*.075)*Math.cos(z*.057)*1.45+Math.sin(z*.103+x*.04)*.65+Math.pow(Math.max(0,d-34),1.42)*.045-Math.max(0,1-lake/21)*3.8;let flat=Math.min(1,Math.max(0,(d-19)/12));return raw*flat;}
const N=64,S=3.2;for(let i=0;i<N;i++)for(let j=0;j<N;j++){let x=(i-N/2)*S,z=(j-N/2)*S,a=[x,ground(x,z),z],b=[x,ground(x,z+S),z+S],c=[x+S,ground(x+S,z+S),z+S],d=[x+S,ground(x+S,z),z],h=(a[1]+b[1]+c[1]+d[1])*.25,r=rnd(i*293+j*37),k=h>22?[.59,.63,.62]:h>12?[.47,.57,.46]:[.31+r*.055,.55+r*.09,.29+r*.04];if(Math.hypot(x+S*.5,z+S*.5)<23)k=[.42+r*.045,.57+r*.05,.32+r*.025];quad(a,b,c,d,k);}
function cone(x,y,z,r,h,k){for(let i=0;i<7;i++){let t=i*Math.PI*2/7,u=(i+1)*Math.PI*2/7;tri([x+Math.cos(t)*r,y,z+Math.sin(t)*r],[x+Math.cos(u)*r,y,z+Math.sin(u)*r],[x,y+h,z],k);}}
function trunk(x,y,z,r,h,k){for(let i=0;i<7;i++){let t=i*Math.PI*2/7,u=(i+1)*Math.PI*2/7;quad([x+Math.cos(t)*r,y,z+Math.sin(t)*r],[x+Math.cos(u)*r,y,z+Math.sin(u)*r],[x+Math.cos(u)*r,y+h,z+Math.sin(u)*r],[x+Math.cos(t)*r,y+h,z+Math.sin(t)*r],k);}}
for(let i=0;i<475;i++){let x=(rnd(i*3+1)-.5)*175,z=(rnd(i*3+2)-.5)*175,h=ground(x,z);if(Math.hypot(x+55,z+42)<23||h>22||Math.hypot(x,z)<25)continue;let s=2+rnd(i*3+9)*3.6;trunk(x,h,z,.15*s,s*.9,[.34,.235,.145]);solidTrunk(x,z,.15*s);cone(x,h+s*.35,z,s*.65,s*1.45,[.13+rnd(i)*.09,.34+rnd(i+8)*.12,.20]);cone(x,h+s*.95,z,s*.47,s*1.18,[.16,.42,.23]);}
for(let i=0;i<140;i++){let x=(rnd(i*7+21)-.5)*140,z=(rnd(i*7+27)-.5)*140,h=ground(x,z);if(h>12||Math.hypot(x+55,z+42)<23||Math.hypot(x,z)<23)continue;let s=.35+rnd(i+88)*.9;cone(x,h,z,s,s*.9,[.47,.54,.39]);}
for(let i=0;i<70;i++){let x=(rnd(i*13+30)-.5)*160,z=(rnd(i*13+31)-.5)*160,h=ground(x,z);if(h>14||Math.hypot(x+55,z+42)<22||Math.hypot(x,z)<23)continue;let s=.4+rnd(i+40)*1.4;cone(x,h,z,s,s*.7,[.46,.47,.43]);}
for(let i=0;i<64;i++){let a=i*2*Math.PI/64,b=(i+1)*2*Math.PI/64;tri([-55,-1.45,-42],[-55+Math.cos(b)*12.8,-1.45,-42+Math.sin(b)*12.8],[-55+Math.cos(a)*12.8,-1.45,-42+Math.sin(a)*12.8],[.29,.66,.76]);}

// Base-camp geometry, arranged as independent props for later interaction logic.
const wood=[.42,.27,.15],woodLight=[.59,.39,.21],canvasTan=[.72,.66,.46],canvasShade=[.54,.49,.33],stone=[.45,.46,.44];
function box(x,y,z,w,h,d,k){let x0=x-w/2,x1=x+w/2,y0=y,y1=y+h,z0=z-d/2,z1=z+d/2;
quad([x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],k);
quad([x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],k);
quad([x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],k);
quad([x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0],k);
quad([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],k);
quad([x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0],k);
}
function log(x,y,z,r,len,k){trunk(x,y,z,r,len,k);}
const y=0;
// Tent platform, ridge, triangular front and two fabric roof sides.
box(-9,.02,-7,9,.23,9,wood);
box(-9,.27,-7,8,.08,8,[.46,.44,.34]);solidBox(-9,-7,7.4,7.1);
let tx=-9,tz=-7,tw=3.7,th=4.4,front=tz+3.55,back=tz-3.55;
tri([tx-tw,.3,front],[tx+tw,.3,front],[tx,th,front],canvasTan);
tri([tx+tw,.3,back],[tx-tw,.3,back],[tx,th,back],canvasShade);
quad([tx-tw,.3,front],[tx-tw,.3,back],[tx,th,back],[tx,th,front],canvasTan);
quad([tx,th,front],[tx,th,back],[tx+tw,.3,back],[tx+tw,.3,front],canvasShade);
tri([tx-1.1,.31,front+.035],[tx+1.1,.31,front+.035],[tx,2.55,front+.035],[.17,.20,.17]);
box(tx,.3,front+0.1,1.3,.08,.2,[.60,.46,.28]);
// Sleeping mat and blanket inside tent, visible from the entrance.
box(-9,.34,-6.8,2.5,.13,3.8,[.26,.39,.33]);
box(-9,.48,-7.35,2.4,.07,1.8,[.64,.34,.24]);
// Campfire with a stone ring and crossed timber.
for(let i=0;i<11;i++){let a=i*Math.PI*2/11;box(1+Math.cos(a)*2,.02,-4+Math.sin(a)*2,.85,.55,.72,[.43+.03*rnd(i),.43,.40]);}solidTrunk(1,-4,2.15);
box(1,.09,-4,3.4,.32,.52,wood);
box(1,.15,-4,.55,.35,3.2,woodLight);
cone(1,.48,-4,1.05,2.4,[.95,.40,.07]);cone(1,.58,-4,.58,1.6,[1,.72,.18]);
// Dining table, four sturdy legs, and benches.
for(let dx of [-2.1,2.1])for(let dz of [-1.1,1.1])box(11+dx,.01,-6+dz,.44,1.8,.44,wood);
box(11,1.8,-6,5.5,.27,3.5,woodLight);solidBox(11,-6,5.5,3.5);
for(let dz of [-2.6,2.6]){box(11,.85,-6+dz,5.6,.24,.8,wood);solidBox(11,-6+dz,5.6,.8);for(let dx of [-2,2])box(11+dx,.01,-6+dz,.35,.9,.35,wood);}
box(11,2.09,-6,1.1,.18,.8,[.66,.66,.57]);
box(10,2.09,-5.5,.65,.34,.65,[.27,.37,.32]);
// Stash / supply corner: crates, barrel and stacked firewood.
for(const [x,z,w,h,d] of [[-12,6,2.4,2.1,2.3],[-9.45,6,2.2,1.6,2],[-11.5,8.3,2.1,1.1,1.9]]){box(x,.05,z,w,h,d,wood);box(x,h+.07,z,w+.07,.17,d+.07,woodLight);solidBox(x,z,w+.07,d+.07);
for(const offset of [-.65,.65])box(x+offset,.1,z+d/2+.045,.12,h,.1,[.30,.21,.12]);}
box(-6,.03,7,1.9,2.3,1.9,[.38,.30,.21]);box(-6,2.3,7,2.05,.16,2.05,[.55,.43,.28]);solidBox(-6,7,2.05,2.05);
for(let i=0;i<8;i++){let xx=4+(i%4)*1.1,zz=8+Math.floor(i/4)*1.0;box(xx,.1,zz,.85,.75,1.4,woodLight);solidBox(xx,zz,.85,1.4);}
// Two log seats and small approach stepping stones.
box(-1,.07,2,4.6,.9,.85,wood);solidBox(-1,2,4.6,.85);
box(5,.07,1.7,4.0,.9,.85,wood);solidBox(5,1.7,4.0,.85);
for(let i=0;i<8;i++){let z=13+i*2.4,x=Math.sin(i*.9)*.65;box(x,.02,z,2.3,.08,1.4,[.55,.51,.39]);}
// Decorative signpost marking the camp.
box(-19,.03,12,.35,3.8,.35,wood);
box(-19,2.8,12,3,.85,.24,woodLight);solidBox(-19,12,.35,.35);

let count=positions.length/3,buf=new Float32Array(count*9);for(let i=0;i<count;i++)for(let j=0;j<3;j++){buf[i*9+j]=positions[i*3+j];buf[i*9+j+3]=colors[i*3+j];buf[i*9+j+6]=normals[i*3+j];}
let buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,buf,gl.STATIC_DRAW);for(const [name,offset] of [['p',0],['c',3],['n',6]]){let loc=gl.getAttribLocation(prog,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,36,offset*4);}
gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.clearColor(.68,.81,.89,1);
const projLoc=gl.getUniformLocation(prog,'proj'),viewLoc=gl.getUniformLocation(prog,'view');
function perspective(fov,aspect,near,far){let f=1/Math.tan(fov/2),nf=1/(near-far);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]);}
function view(eye,yaw,pitch){let cp=Math.cos(pitch),z=[-Math.sin(yaw)*cp,-Math.sin(pitch),Math.cos(yaw)*cp],x=[z[2],0,-z[0]],l=Math.hypot(...x);x=x.map(q=>q/l);let y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-x.reduce((s,q,i)=>s+q*eye[i],0),-y.reduce((s,q,i)=>s+q*eye[i],0),-z.reduce((s,q,i)=>s+q*eye[i],0),1]);}
let camera=[0,8,32],yaw=0,pitch=-.26,fly=false,axis=[0,0],drag=null,keys={},last=performance.now();
const pad=document.getElementById('pad'),knob=document.getElementById('knob');let padPointer=null;
function movePad(e){let r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.34,len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len;}axis=[dx/max,-dy/max];knob.style.transform='translate('+dx+'px,'+dy+'px)';}
pad.addEventListener('pointerdown',e=>{e.preventDefault();padPointer=e.pointerId;pad.setPointerCapture(e.pointerId);movePad(e);});pad.addEventListener('pointermove',e=>{if(e.pointerId===padPointer)movePad(e);});
function stopPad(e){if(e.pointerId===padPointer){padPointer=null;axis=[0,0];knob.style.transform='translate(0,0)';}}for(const ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,stopPad);
canvas.addEventListener('pointerdown',e=>{drag=[e.pointerId,e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag||drag[0]!==e.pointerId)return;yaw+=(e.clientX-drag[1])*.0055;pitch=Math.max(-1.15,Math.min(1.15,pitch-(e.clientY-drag[2])*.004));drag=[e.pointerId,e.clientX,e.clientY];});for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,()=>drag=null);
document.getElementById('fly').addEventListener('click',e=>{fly=!fly;e.currentTarget.textContent=fly?'✦ Walking mode':'✦ Fly mode';});document.getElementById('reset').addEventListener('click',()=>{camera=[0,8,32];yaw=0;pitch=-.26;});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow'))e.preventDefault();});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{axis=[0,0];keys={};knob.style.transform='translate(0,0)';});
status.style.display='none';diag.textContent='Ready: '+count+' vertices';
let frameNumber=0;function frame(t){try{let dt=Math.min(.05,(t-last)/1000);last=t;let forward=axis[1]+(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),right=axis[0]+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),m=Math.hypot(forward,right);if(m>1){forward/=m;right/=m;}let speed=(fly?24:13)*dt;const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*right)*speed,dz=(-Math.cos(yaw)*forward+Math.sin(yaw)*right)*speed;if(fly){camera[0]=Math.max(-93,Math.min(93,camera[0]+dx));camera[2]=Math.max(-93,Math.min(93,camera[2]+dz));camera[1]+=Math.sin(pitch)*forward*speed;camera[1]=Math.max(ground(camera[0],camera[2])+2.5,camera[1]);}else {const steps=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.25));for(let i=0;i<steps;i++){const sx=dx/steps,sz=dz/steps;if(!blocked(camera[0]+sx,camera[2]))camera[0]+=sx;if(!blocked(camera[0],camera[2]+sz))camera[2]+=sz;}camera[1]+=(ground(camera[0],camera[2])+3.1-camera[1])*.14;}
let w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,1.5),pw=Math.floor(w*dpr),ph=Math.floor(h*dpr);if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph;gl.viewport(0,0,pw,ph);}gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix4fv(projLoc,false,perspective(1.12,w/h,.1,300));gl.uniformMatrix4fv(viewLoc,false,view(camera,yaw,pitch));gl.drawArrays(gl.TRIANGLES,0,count);if(++frameNumber%60===1){let err=gl.getError();diag.textContent='Frame '+frameNumber+' | Colliders '+obstacles.length+' | GL '+err;}requestAnimationFrame(frame);}catch(e){diag.textContent='RENDER ERROR: '+e.message;diag.style.background='#992323';console.error(e);}}
requestAnimationFrame(frame);
})();
</script></body></html>
